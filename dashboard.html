<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0,viewport-fit=cover">
<title>Dashboard — Aaradhya SFS Operations</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;}
:root{--teal:#00524A;--gold:#C8922A;--dark:#111C1A;--muted:#5A7A75;--white:#fff;--border:#D4E0DE;--page-bg:#F0F4F3;}
body{font-family:'DM Sans',-apple-system,sans-serif;background:var(--page-bg);color:var(--dark);}
.btn{display:inline-block;padding:8px 16px;border-radius:8px;border:none;font-weight:500;cursor:pointer;text-decoration:none;}
.btn-primary{background:var(--teal);color:white;}
.btn-sm{padding:6px 12px;font-size:12px;}
.card{background:white;border-radius:12px;border:1px solid var(--border);padding:16px;margin-bottom:16px;}
.kpi-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:12px;margin-bottom:20px;}
@media(min-width:768px){.kpi-grid{grid-template-columns:repeat(5,1fr);}}
.kpi{background:white;border-radius:12px;padding:14px;text-align:center;}
.kpi-val{font-size:32px;font-weight:700;color:var(--teal);}
.table-responsive{overflow-x:auto;}
table{width:100%;border-collapse:collapse;}
th,td{padding:10px 12px;text-align:left;border-bottom:1px solid var(--border);font-size:13px;}
.nav{padding:12px 20px;background:var(--dark);color:white;display:flex;justify-content:space-between;flex-wrap:wrap;gap:12px;}
.nav-links{display:flex;gap:12px;flex-wrap:wrap;}
.nav-link{color:rgba(255,255,255,0.7);text-decoration:none;}
.login-card{max-width:340px;margin:100px auto;background:white;padding:32px;border-radius:20px;}
input{padding:10px;border:1px solid var(--border);border-radius:8px;width:100%;margin-bottom:12px;}
</style>
</head>
<body>
<div id="loginView" class="login-card"><h2>Aaradhya SFS</h2><p>Internal Dashboard</p><input type="text" id="username" placeholder="admin"><input type="password" id="password" placeholder="••••"><button class="btn btn-primary" onclick="doLogin()">Login</button><p style="font-size:12px;margin-top:12px;">Default: admin / aaradhya2025</p></div>
<div id="dashView" style="display:none;"><div class="nav"><div class="nav-logo" style="font-weight:700;">Aaradhya SFS Ops</div><div class="nav-links"><a href="#" onclick="showPanel('overview')" class="nav-link">Overview</a><a href="#" onclick="showPanel('candidates')" class="nav-link">Candidates</a><a href="#" onclick="showPanel('clients')" class="nav-link">Clients</a><a href="#" onclick="showPanel('deployments')" class="nav-link">Deployments</a><a href="#" onclick="logout()" class="nav-link">Logout</a></div></div><div class="container" style="padding:20px;"><div id="overviewPanel"><div class="kpi-grid" id="kpiRow"></div><div class="card"><h3>Recent Activity</h3><div id="activityList">Loading...</div></div></div><div id="candidatesPanel" style="display:none;"><div class="card"><h3>Candidate Pipeline</h3><div class="table-responsive"><table id="candTable"><thead><tr><th>Name</th><th>HQ</th><th>Status</th></tr></thead><tbody></tbody></table></div></div></div><div id="clientsPanel" style="display:none;"><div class="card"><h3>Client Companies</h3><div class="table-responsive"><table id="clientTable"><thead><tr><th>Company</th><th>Contact</th><th>Status</th></tr></thead><tbody></tbody></table></div></div></div><div id="deploymentsPanel" style="display:none;"><div class="card"><h3>Deployed MRs</h3><div class="table-responsive"><table id="depTable"><thead><tr><th>MR Name</th><th>Client</th><th>HQ</th><th>Status</th></tr></thead><tbody></tbody></table></div></div></div></div></div>
<script>
let loggedIn=false;
const sampleData={candidates:[{name:"Rajesh Kumar",hq:"Bhubaneswar",status:"Active"},{name:"Sneha Patra",hq:"Cuttack",status:"Shortlisted"}],clients:[{company:"Medico Pharma",contact:"Mr. Sharma",status:"Active"}],deployments:[{name:"Amit Das",client:"Medico Pharma",hq:"Bhubaneswar",status:"Active"}],activities:["New requirement from Medico Pharma","Candidate Rajesh shortlisted"]};
function doLogin(){const u=document.getElementById('username').value;const p=document.getElementById('password').value;if(u==='admin'&&p==='aaradhya2025'){loggedIn=true;document.getElementById('loginView').style.display='none';document.getElementById('dashView').style.display='block';renderAll();}else{alert('Invalid credentials');}}
function logout(){loggedIn=false;document.getElementById('loginView').style.display='block';document.getElementById('dashView').style.display='none';}
function renderAll(){document.getElementById('kpiRow').innerHTML=`<div class="kpi"><div class="kpi-val">${sampleData.candidates.length}</div><div>Candidates</div></div><div class="kpi"><div class="kpi-val">${sampleData.clients.length}</div><div>Clients</div></div><div class="kpi"><div class="kpi-val">${sampleData.deployments.length}</div><div>Deployed</div></div>`;document.getElementById('activityList').innerHTML=sampleData.activities.map(a=>`<div>• ${a}</div>`).join('');document.querySelector('#candTable tbody').innerHTML=sampleData.candidates.map(c=>`<tr><td>${c.name}</td><td>${c.hq}</td><td>${c.status}</td></tr>`).join('');document.querySelector('#clientTable tbody').innerHTML=sampleData.clients.map(c=>`<tr><td>${c.company}</td><td>${c.contact}</td><td>${c.status}</td></tr>`).join('');document.querySelector('#depTable tbody').innerHTML=sampleData.deployments.map(d=>`<tr><td>${d.name}</td><td>${d.client}</td><td>${d.hq}</td><td>${d.status}</td></tr>`).join('');}
function showPanel(p){document.getElementById('overviewPanel').style.display='none';document.getElementById('candidatesPanel').style.display='none';document.getElementById('clientsPanel').style.display='none';document.getElementById('deploymentsPanel').style.display='none';if(p==='overview')document.getElementById('overviewPanel').style.display='block';if(p==='candidates')document.getElementById('candidatesPanel').style.display='block';if(p==='clients')document.getElementById('clientsPanel').style.display='block';if(p==='deployments')document.getElementById('deploymentsPanel').style.display='block';}
</script>
</body>
</html>
